<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
</head>
<body>

<h2>Election Results</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Candidate</th>
        <th>Votes</th>
    </tr>
    {% for r in results %}
    <tr>
        <td>{{ r.name }}</td>
        <td>{{ r.votes }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="2">No results</td>
    </tr>
    {% endfor %}
</table>

<a href="/">Back</a>

</body>
</html>
